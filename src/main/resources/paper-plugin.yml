name: LiveTracker
version: '1.0-SNAPSHOT'
main: com.github.pinont.Core
api-version: '1.21'
prefix: LIVE
load: STARTUP
description: A Singularity plugin that tracks streaming status.
softdepend:
  - PlaceholderAPI

permissions:
  livetracker.commands.admin:
    description: Allows use of LiveTracker admin commands.
  livetracker.status.live:
    description: Status that shows the player is live.
  livetracker.status.offline:
    description: Status that shows the player is offline.